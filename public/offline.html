<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1976d2" />
    <title>Erro 503</title>
    <style>
      * { margin: 0; color: #fff; }
      html, body { min-height: 100%; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background-color: #1976d2;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 80vw;
        max-width: 650px;
        margin: auto;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 { font-size: 10em; line-height: 1; font-weight: 800; }
      h5 {
        font-size: 1.2rem;
        font-weight: 600;
        line-height: 1.5;
        margin: 10px auto;
        max-width: 500px;
      }
      img {
        height: 30vh;
        max-width: 80%;
        display: block;
        object-fit: contain;
        margin: 5rem auto 0;
      }
      .btn {
        width: 80%;
        display: block;
        color: #fff;
        background: transparent;
        margin: 5rem auto 0;
        padding: 1.2rem 0.5rem;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        font-family: inherit;
        font-size: 1rem;
      }
      .btn:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main>
      <span>
        <h1>503</h1>
        <h5>Houston, temos um probleminha</h5>
      </span>
      <img src="/error/503.svg" alt="" />
      <button class="btn" type="button" onclick="location.reload()">
        O serviço pode estar indisponível ou você está offline. Tente novamente mais tarde!
      </button>
    </main>
  </body>
</html>
